[package]
name = "cosmic-ext-applet-bitrate"
version = "3.0.2"
edition = "2024"
license = "GPL-3.0"
description = "A Bandwidth Monitor applet for the COSMIC™ desktop"
repository = "https://github.com/Aviral-Omar/bitrate.git"

[dependencies]
futures-util = "0.3.32"
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.0"
# applet for applet support
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = ["applet", "applet-token" ] }
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
